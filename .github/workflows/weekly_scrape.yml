name: Weekly Data and Model Refresh

on:
  schedule:
    # Runs at 00:00 every Monday (UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up the run by caching dependencies

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch wheels are ~10x smaller than the default CUDA build
        pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: 1. Run Scraper (Raw Data)
      env:
        RIOT_KEY: ${{ secrets.RIOT_KEY }}
        # Scale knobs (see collect_data.py). With a production key, lower
        # RIOT_REQUEST_DELAY and raise the limits.
        PLAYERS_PER_TIER: '40'
        MATCHES_PER_PLAYER: '20'
        MAX_NEW_MATCHES_PER_REGION: '500'
        RIOT_REQUEST_DELAY: '1.2'
      run: python modules/collect_data.py

    - name: 2. Run EDA (Cleaning & Role Fixes)
      run: python modules/eda.py

    - name: 3. Run Preprocessing (Graph Construction)
      run: python modules/preprocess.py

    - name: 4. Run GNN Training (Draft Model)
      run: python modules/train_gnn.py

    - name: 5. Refresh Champion Metadata Snapshot (names/icons)
      run: python modules/champions.py || echo "Data Dragon unavailable, keeping existing snapshot"

    - name: Commit and Push All Changes
      run: |
        git config --global user.name "NexusNode-Bot"
        git config --global user.email "bot@nexusnode.ai"

        # Data, processed graph files, and model weights all live under data/
        git add data/

        # Commit only if there are actual modifications
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "🚀 Automated Pipeline: Scrape, Clean, & Retrain [skip ci]"
          git push
        else
          echo "No changes detected. Workspace is clean."
        fi
